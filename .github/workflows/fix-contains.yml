name: Fix contains_key
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix headers.contains to headers.contains_key
        run: |
          sed -i 's/headers\.contains(/headers.contains_key(/g' src/webhook/github_api.rs src/webhook/gitlab_api.rs
      - name: Verify
        run: |
          grep -n 'headers.contains' src/webhook/github_api.rs src/webhook/gitlab_api.rs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/webhook/github_api.rs src/webhook/gitlab_api.rs
          git commit -m "fix: use contains_key instead of contains for HeaderMap in tests" || echo "No changes to commit"
          git push