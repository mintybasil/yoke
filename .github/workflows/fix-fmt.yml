name: Fix Formatting
on:
  push:
    branches:
      - zeroklaw/fix-graceful-error-handling-216
    paths:
      - "TRIGGER_FMT_FIX"
permissions:
  contents: write
jobs:
  fix-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: apply rustfmt formatting (trailing newlines + style)"
          git push origin ${{ github.ref_name }}
      - name: Clean up trigger
        run: |
          git rm TRIGGER_FMT_FIX || true
          git diff --staged --quiet || git commit -m "ci: remove fmt fix trigger file"
          git push origin ${{ github.ref_name }}